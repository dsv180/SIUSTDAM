# Конфиг пилота TDAM (standalone) — заказчик: отдел поддержки 1С.
# LLM-ключ подставляется из переменной окружения TDAI_LLM_API_KEY
# (её задаёт start-gateway.cmd из gateway.env). Ключ в git и файлы не пишем.

server:
  port: 8420
  host: "0.0.0.0"          # коллективный доступ: + TDAI_GATEWAY_API_KEY в gateway.env (решение о включении — при развёртывании)

data:
  baseDir: "~/.memory-tencentdb/memory-tdai"

llm:
  baseUrl: "https://api.aitunnel.ru/v1"
  apiKey: "${TDAI_LLM_API_KEY}"
  model: "deepseek-v4.1-flash"  # выбор заказчика: 9/100 ₽ за млн токенов (вход ≤ 30-40, выход ≤ 200)
  maxTokens: 8192             # deepseek-v4.1-flash — рассуждающая: в L2 сжигает 4к на мышление
  timeoutMs: 120000

memory:
  capture:
    enabled: true
  extraction:
    enabled: true
    enableDedup: true
    maxMemoriesPerSession: 20
  persona:
    triggerEveryN: 50
    maxScenes: 15
    triggerMode: current
  pipeline:
    everyNConversations: 5
    enableWarmup: true
    l1IdleTimeoutSeconds: 600
    l2DelayAfterL1Seconds: 90
    l2MinIntervalSeconds: 900
    l2MaxIntervalSeconds: 3600
  recall:
    enabled: true
    maxResults: 5
    scoreThreshold: 0.3
    strategy: "hybrid"
    timeoutMs: 5000
  storeBackend: "sqlite"
  embedding:
    # Решение заказчика 08.11.2026: основной канал эмбеддингов — локальная
    # Ollama + bge-m3 (русский проверен живьём на корпусе отдела). Ollama
    # с моделью bge-m3 ставится на машине ДО первого capture (чек-лист
    # развёртывания). Смена модели = полный пере-эмбеддинг корпуса.
    enabled: true
    provider: "openai"             # OpenAI-совместимый API локальной Ollama
    baseUrl: "http://127.0.0.1:11434/v1"
    apiKey: "ollama"
    model: "bge-m3"
    dimensions: 1024
    sendDimensions: false          # bge-m3 не поддерживает matryoshka-усечение
    # Запасной канал (машинам без Ollama) — НЕ ИСПОЛЬЗУЕТСЯ, оставлен как
    # справочник; возвращение к провайдерским эмбеддингам возможно под
    # модели Sber/Яндекса (решение заказчика 08.11.2026):
    # provider: "openai"
    # baseUrl: "https://api.aitunnel.ru/v1"
    # apiKey: "${TDAI_LLM_API_KEY}"
    # model: "text-embedding-3-small"
    # dimensions: 1536
  bm25:
    enabled: true
    language: "en"            # русский текст: en-токенизация вместо jieba(zh)

# ── Skill-модуль: извлечение скиллов из диалогов и маршрутизация ──
skill:
  enabled: true
  routing:
    mode: bm25
    searchTopK: 20
  extraction:
    enabled: true
    maxIterations: 16
  resources:
    maxResourceSizeBytes: 5000000
    allowExecutable: false
